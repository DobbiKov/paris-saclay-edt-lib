<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saclay Timetable</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1b1f27; --muted: #667085; --line: #e3e6ec; --accent: #7a1f3d;
  --today: #fdf3f6; --ev-bg-l: 90%; --ev-bd-l: 42%; --ev-tx: #1b1f27; --shadow: 0 1px 2px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --panel: #1c1f26; --text: #e8eaef; --muted: #9aa2b1; --line: #2c313b; --accent: #e0839f;
          --today: #241c21; --ev-bg-l: 24%; --ev-bd-l: 62%; --ev-tx: #eef0f5; --shadow: none; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
h1 { font-size: 16px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .2px; }
select, input[type=search], button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.combo { position: relative; flex: 1 1 280px; max-width: 460px; }
.combo input { width: 100%; }
.list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 320px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.list[hidden] { display: none; }
.list div { padding: 7px 10px; cursor: pointer; } .list div small { display: block; color: var(--muted); }
.list div:hover, .list div.act { background: var(--today); }
.nav { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.nav strong { min-width: 190px; text-align: center; font-weight: 600; }
label.chk { color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
#banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
#banner.err { border-color: #d92d20; color: #d92d20; } #banner[hidden] { display: none; }
main { padding: 12px 16px 28px; }
.scroller { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.cal { min-width: 760px; position: relative; }
.row { display: grid; grid-template-columns: 52px repeat(var(--days), 1fr); }
.dayhead { padding: 8px 6px; text-align: center; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); font-weight: 600; }
.dayhead small { display: block; color: var(--muted); font-weight: 400; }
.dayhead.today { color: var(--accent); background: var(--today); }
.allday { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px; min-height: 8px; display: flex; flex-direction: column; gap: 3px; }
.allday span { font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--muted); }
.body { position: relative; display: grid; grid-template-columns: 52px repeat(var(--days), 1fr); height: var(--h); }
.hours { position: relative; } .hours span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; color: var(--muted); }
.col { position: relative; border-left: 1px solid var(--line); }
.col.today { background: var(--today); }
.col::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--ph) - 1px), var(--line) calc(var(--ph) - 1px), var(--line) var(--ph)); }
.ev { position: absolute; padding: 3px 6px; border-radius: 6px; overflow: hidden; cursor: pointer; font-size: 12px; line-height: 1.3; color: var(--ev-tx);
      background: hsl(var(--hue) 70% var(--ev-bg-l)); border-left: 4px solid hsl(var(--hue) 60% var(--ev-bd-l)); border-top: 1px solid var(--panel); }
.ev:hover, .ev:focus-visible { z-index: 5; overflow: visible; min-height: min-content; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.ev b { display: block; font-weight: 600; } .ev .t { opacity: .75; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); max-width: 460px; width: calc(100% - 32px); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h2 { margin: 0 0 4px; font-size: 17px; } dialog dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; margin: 14px 0; }
dialog dt { color: var(--muted); } dialog dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: hsl(var(--hue) 60% var(--ev-bd-l)); }
.empty { padding: 60px 16px; text-align: center; color: var(--muted); }
.spin { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Saclay Timetable</h1>
  <select id="entity" aria-label="Faculty / institute"></select>
  <div class="combo">
    <input id="groupInput" type="search" placeholder="Search a group, e.g. L3 CHI" autocomplete="off" aria-label="Group">
    <div id="groupList" class="list" role="listbox" hidden></div>
  </div>
  <label class="chk"><input type="checkbox" id="exact"> Hide sub-group sessions</label>
  <div class="nav">
    <button id="prev" aria-label="Previous week">‹</button>
    <strong id="range"></strong>
    <button id="next" aria-label="Next week">›</button>
    <button id="today">Today</button>
  </div>
</header>
<div id="banner" hidden></div>
<main>
  <div class="scroller"><div class="cal" id="cal"><div class="empty">Choose a group to see its timetable.</div></div></div>
  <div class="legend" id="legend"></div>
</main>
<dialog id="dlg"><div id="dlgBody"></div><form method="dialog"><button>Close</button></form></dialog>

<script>
const PH = 56;                         // pixels per hour
const $ = id => document.getElementById(id);
const st = { entity: "sciences", group: "", week: mondayOf(new Date()), events: [], token: 0 };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function hm(s) { return s.slice(11, 16); }
function frac(s) { return +s.slice(11, 13) + +s.slice(14, 16) / 60; }
function hue(s) { let h = 0; for (const c of s || "") h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
}
function banner(msg, err) { const b = $("banner"); b.hidden = !msg; b.className = err ? "err" : ""; b.textContent = msg || ""; }

async function api(path, params) {
  const r = await fetch(path + "?" + new URLSearchParams(params));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

/* ---------- group picker ---------- */
let searchTimer, act = -1, results = [];
$("groupInput").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = $("groupInput").value.trim();
  if (!q) { $("groupList").hidden = true; return; }
  searchTimer = setTimeout(async () => {
    try {
      results = await api("/api/groups", { entity: st.entity, q });
      act = -1; renderList(); banner("");
    } catch (e) { banner(e.message, true); }
  }, 250);
});
$("groupInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); act = Math.max(0, Math.min(results.length - 1, act + (e.key === "ArrowDown" ? 1 : -1))); renderList(); }
  else if (e.key === "Enter" && results[act < 0 ? 0 : act]) pick(results[act < 0 ? 0 : act]);
  else if (e.key === "Escape") $("groupList").hidden = true;
});
document.addEventListener("click", e => { if (!e.target.closest(".combo")) $("groupList").hidden = true; });
function renderList() {
  const box = $("groupList"); box.replaceChildren();
  if (!results.length) box.append(el("div", { textContent: "No group found" }));
  results.forEach((g, i) => {
    const d = el("div", { className: i === act ? "act" : "", role: "option" }, g.text, el("small", { textContent: g.department || "" }));
    d.addEventListener("click", () => pick(g));
    box.append(d);
  });
  box.hidden = false;
}
function pick(g) {
  st.group = g.id; $("groupInput").value = g.id; $("groupList").hidden = true;
  store.set("group", g.id); store.set("entity", st.entity); load();
}

/* ---------- data ---------- */
async function load() {
  if (!st.group) return;
  const token = ++st.token, end = addDays(st.week, 7);
  $("range").textContent = `${st.week.toLocaleDateString(undefined, { day: "numeric", month: "short" })} – ${addDays(st.week, 6).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;
  $("cal").classList.add("spin"); banner("Loading…");
  try {
    const ev = await api("/api/timetable", { entity: st.entity, group: st.group, start: iso(st.week), end: iso(end), details: 1 });
    if (token !== st.token) return;               // a newer request superseded this one
    st.events = ev; banner(""); render();
  } catch (e) { if (token === st.token) { banner(e.message, true); } }
  finally { if (token === st.token) $("cal").classList.remove("spin"); }
}

/* ---------- rendering ---------- */
function title(e) { return (e.moduleNames[0] || (e.modules[0]) || e.details[1] || e.category || "Event").trim(); }

function layout(list) {                           // side-by-side columns for overlapping events
  list.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1;
  const flush = () => { const n = Math.max(0, ...cluster.map(x => x.col)) + 1; cluster.forEach(x => x.n = n); cluster = []; };
  for (const x of list) {
    if (x.s >= clusterEnd) { flush(); clusterEnd = -1; }
    const used = new Set(cluster.filter(c => c.e > x.s).map(c => c.col));
    x.col = 0; while (used.has(x.col)) x.col++;
    cluster.push(x); clusterEnd = Math.max(clusterEnd, x.e);
  }
  flush();
}

function render() {
  let evs = st.events;
  if ($("exact").checked) evs = evs.filter(e => !e.groups.length || e.groups.includes(st.group));
  const days = [...Array(7)].map((_, i) => addDays(st.week, i));
  const hasSun = evs.some(e => new Date(e.start).getDay() === 0);
  const shown = days.slice(0, hasSun ? 7 : 6);
  const timed = evs.filter(e => !e.allDay && e.end);
  const h0 = Math.min(8, ...timed.map(e => Math.floor(frac(e.start))));
  const h1 = Math.max(18, ...timed.map(e => Math.ceil(frac(e.end))));
  const cal = $("cal"); cal.replaceChildren(); cal.style.setProperty("--days", shown.length);
  const todayIso = iso(new Date());

  const head = el("div", { className: "row" }, el("div"));
  const all = el("div", { className: "row" }, el("div"));
  shown.forEach(d => {
    head.append(el("div", { className: "dayhead" + (iso(d) === todayIso ? " today" : "") }, d.toLocaleDateString(undefined, { weekday: "short" }), el("small", { textContent: d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) })));
    const box = el("div", { className: "allday" });
    evs.filter(e => e.allDay && e.start.startsWith(iso(d))).forEach(e => box.append(el("span", { textContent: title(e) })));
    all.append(box);
  });
  const body = el("div", { className: "body" });
  body.style.setProperty("--h", (h1 - h0) * PH + "px"); body.style.setProperty("--ph", PH + "px");
  const hours = el("div", { className: "hours" });
  for (let h = h0 + 1; h < h1; h++) { const s = el("span", { textContent: String(h).padStart(2, "0") + ":00" }); s.style.top = (h - h0) * PH + "px"; hours.append(s); }
  body.append(hours);
  shown.forEach(d => {
    const col = el("div", { className: "col" + (iso(d) === todayIso ? " today" : "") });
    const items = timed.filter(e => e.start.startsWith(iso(d))).map(e => ({ ev: e, s: frac(e.start), e: frac(e.end) }));
    layout(items);
    items.forEach(x => {
      const e = x.ev, node = el("div", { className: "ev", tabIndex: 0, role: "button" });
      node.style.cssText = `--hue:${hue(e.category)};top:${(x.s - h0) * PH}px;height:${Math.max(18, (x.e - x.s) * PH - 2)}px;left:calc(${x.col / x.n * 100}% + 2px);width:calc(${100 / x.n}% - 4px)`;
      node.append(el("b", { textContent: title(e) }), el("span", { className: "t", textContent: `${hm(e.start)}–${hm(e.end)} · ${[e.category, e.rooms[0]].filter(Boolean).join(" · ")}` }));
      if (e.staff.length) node.append(el("div", { className: "t", textContent: e.staff.join(", ") }));
      node.addEventListener("click", () => showEvent(e));
      node.addEventListener("keydown", k => { if (k.key === "Enter") showEvent(e); });
      col.append(node);
    });
    body.append(col);
  });
  cal.append(head, all, body);
  if (!evs.length) cal.append(el("div", { className: "empty", textContent: "No sessions this week for this group." }));

  const cats = [...new Set(evs.map(e => e.category).filter(Boolean))].sort();
  $("legend").replaceChildren(...cats.map(c => { const s = el("span"); s.style.setProperty("--hue", hue(c)); s.append(el("i"), c); return s; }));
}

function showEvent(e) {
  const rows = [["When", `${new Date(e.start).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}, ${hm(e.start)}–${e.end ? hm(e.end) : "?"}`],
    ["Type", e.category], ["Course", [...e.moduleNames, ...e.modules].filter((v, i, a) => v && a.indexOf(v) === i).join(" · ")],
    ["Room", e.rooms.join(", ")], ["Site", e.sites.join(", ")], ["Staff", e.staff.join(", ")], ["Groups", e.groups.join(", ")], ["Notes", e.notes]];
  const dl = el("dl");
  rows.filter(r => r[1]).forEach(([k, v]) => dl.append(el("dt", { textContent: k }), el("dd", { textContent: v })));
  $("dlgBody").replaceChildren(el("h2", { textContent: title(e) }), dl);
  $("dlg").showModal();
}

/* ---------- wiring ---------- */
$("prev").onclick = () => { st.week = addDays(st.week, -7); load(); };
$("next").onclick = () => { st.week = addDays(st.week, 7); load(); };
$("today").onclick = () => { st.week = mondayOf(new Date()); load(); };
$("exact").onchange = () => st.events.length && render();
$("entity").onchange = () => { st.entity = $("entity").value; st.group = ""; $("groupInput").value = ""; store.set("entity", st.entity); $("cal").replaceChildren(el("div", { className: "empty", textContent: "Choose a group to see its timetable." })); };

(async function init() {
  try {
    const entities = await api("/api/entities", {});
    const labels = { sciences: "Sciences · STAPS · Pharmacie · UFR Sceaux", iut_sceaux: "IUT Sceaux", iut_cachan: "IUT Cachan", medecine: "Médecine (UFR KB)" };
    $("entity").replaceChildren(...entities.map(k => el("option", { value: k, textContent: labels[k] || k })));
    const saved = store.get("entity");
    st.entity = entities.includes(saved) ? saved : entities[0]; $("entity").value = st.entity;
    const g = store.get("group");
    if (g) { st.group = g; $("groupInput").value = g; load(); }
  } catch (e) { banner(e.message, true); }
})();
</script>
</body>
</html>
